<div class="position-relative">
    <button type="button" class="btn btn-outline-secondary w-100 text-start" (click)="toggle()">
        {{ display() || i18n.t('picker.placeholder') }}
    </button>

    @if (open()) {
        <div class="card card-body position-absolute mt-1 shadow z-3" style="min-width: 300px">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <button
                    type="button"
                    class="btn btn-sm btn-outline-secondary"
                    (click)="prevMonth()"
                >
                    ‹
                </button>
                <strong>{{ monthLabel() }}</strong>
                <button
                    type="button"
                    class="btn btn-sm btn-outline-secondary"
                    (click)="nextMonth()"
                >
                    ›
                </button>
            </div>

            <div class="d-grid gap-1" style="grid-template-columns: repeat(7, 1fr)">
                @for (wd of weekdays(); track $index) {
                    <div class="text-center small text-muted">{{ wd }}</div>
                }
                @for (cell of cells(); track $index) {
                    @if (cell) {
                        <button
                            type="button"
                            class="btn btn-sm"
                            [class.btn-primary]="isSelected(cell)"
                            [class.btn-outline-secondary]="!isSelected(cell)"
                            (click)="selectDay(cell)"
                        >
                            {{ cell.getDate() }}
                        </button>
                    } @else {
                        <span></span>
                    }
                }
            </div>

            <div class="mt-3">
                <label class="form-label small">{{ i18n.t('picker.time') }}</label>
                <select class="form-select form-select-sm" (change)="onTimeChange($event)">
                    @for (t of timeOptions; track t) {
                        <option [value]="t" [selected]="t === time()">{{ t }}</option>
                    }
                </select>
            </div>
        </div>
    }
</div>
